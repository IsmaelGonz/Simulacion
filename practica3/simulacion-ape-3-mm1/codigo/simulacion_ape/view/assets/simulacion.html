<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Caja rápida — Simulación M/M/1 con SimPy</title>
<style>
/*__FONT_FACES__*/
:root {
  --ink: #16171a;
  --ink-soft: #3d3f45;
  --wall: #e4e7ea;
  --floor: #d3d8dd;
  --paper: #f7f8f9;
  --signal: #ffc20e;
  --exit: #00875a;
  --alert: #c8102e;
  --muted: #5d636b;
  --rule: #c2c8cf;
  --radius: 6px;
  --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
  font-size: clamp(13px, 0.84vw, 22px);
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  font-family: "Overpass", "Noto Sans", "Helvetica Neue", Arial, sans-serif;
  background: var(--wall);
  color: var(--ink);
  display: grid;
  grid-template-rows: auto 1fr;
  min-height: 100vh;
  font-variant-numeric: tabular-nums;
  -webkit-font-smoothing: antialiased;
}
::selection { background: var(--signal); color: var(--ink); }
:focus-visible { outline: 3px solid var(--signal); outline-offset: 3px; }
button { font: inherit; color: inherit; cursor: pointer; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- franja superior: letrero colgante ---------- */
.strip {
  display: grid;
  grid-template-columns: auto 1fr auto;
  align-items: center;
  gap: 2.4rem;
  padding: 0.9rem 1.6rem;
  background: var(--ink);
  color: #fff;
}
.brand { display: flex; align-items: center; gap: 1rem; }
.brand-mark {
  display: grid; place-items: center;
  width: 3.4rem; height: 3.4rem;
  background: var(--signal); color: var(--ink);
  border-radius: var(--radius);
}
.brand-mark svg { width: 2.3rem; height: 2.3rem; }
.brand h1 { margin: 0; font-size: 2rem; font-weight: 900; letter-spacing: -0.01em; line-height: 1; }
.brand p { margin: 0.35rem 0 0; font-size: 1.05rem; color: #c5cad0; }

.gates { display: flex; gap: 0.6rem; justify-content: center; }
.gate {
  display: grid; grid-template-columns: auto 1fr; align-items: center; column-gap: 0.8rem;
  min-width: 15.5rem;
  padding: 0.55rem 1rem 0.55rem 0.55rem;
  background: transparent; border: 2px solid #4a4c52; border-radius: var(--radius);
  text-align: left;
  transition: background-color 180ms var(--ease-out), border-color 180ms var(--ease-out);
}
.gate:hover { border-color: #878d95; }
.gate-number {
  grid-row: span 2;
  display: grid; place-items: center;
  width: 2.8rem; height: 2.8rem;
  border-radius: 4px;
  background: #fff; color: var(--ink);
  font-size: 1.9rem; font-weight: 900; line-height: 1; padding-top: 0.2rem;
}
.gate-title { font-size: 1.15rem; font-weight: 700; line-height: 1.1; }
.gate-params { display: flex; gap: 0.9rem; font-size: 0.95rem; color: #c5cad0; line-height: 1.2; }
.gate[aria-pressed="true"] { background: var(--signal); border-color: var(--signal); color: var(--ink); }
.gate[aria-pressed="true"] .gate-number { background: var(--ink); color: var(--signal); }
.gate[aria-pressed="true"] .gate-params { color: var(--ink-soft); }

.controls { display: flex; align-items: center; gap: 0.6rem; }
.icon-button {
  display: grid; place-items: center;
  width: 3.2rem; height: 3.2rem;
  background: #fff; color: var(--ink);
  border: 0; border-radius: var(--radius);
  transition: background-color 160ms var(--ease-out);
}
.icon-button:hover { background: var(--signal); }
.icon-button svg { width: 1.6rem; height: 1.6rem; }
.speed { display: flex; align-items: stretch; gap: 3px; padding: 3px; border: 2px solid #4a4c52; border-radius: var(--radius); }
.speed-label { padding: 0 0.7rem; display: grid; place-items: center; font-size: 0.9rem; color: #c5cad0; line-height: 1.1; text-align: center; }
.speed button {
  min-width: 3rem; padding: 0.4rem 0.5rem;
  background: transparent; border: 0; border-radius: 4px;
  font-size: 1.15rem; font-weight: 700;
}
.speed button[aria-pressed="true"] { background: #fff; color: var(--ink); }

/* ---------- cuerpo ---------- */
main {
  display: grid;
  grid-template-columns: minmax(0, 1.62fr) minmax(0, 1fr);
  grid-template-rows: minmax(0, 1fr) minmax(16rem, 31vh);
  gap: 1.2rem;
  padding: 1.2rem 1.6rem 1.4rem;
  min-height: 0;
}
.scene { position: relative; min-height: 0; border-radius: var(--radius); overflow: hidden; background: var(--paper); }
.scene svg { display: block; width: 100%; height: 100%; }

/* ---------- tablero de resultados (estilo panel de salidas) ---------- */
.board {
  display: grid;
  grid-template-rows: auto auto auto minmax(0, 1fr);
  gap: 1.1rem;
  padding: 1.3rem 1.5rem;
  background: var(--ink); color: #fff;
  border-radius: var(--radius);
  min-height: 0;
}
.clock { display: flex; flex-wrap: nowrap; align-items: baseline; justify-content: space-between; gap: 1rem; }
.clock-value { white-space: nowrap; font-size: 3.4rem; font-weight: 900; line-height: 1; letter-spacing: -0.02em; }
.clock-value small { font-size: 1.4rem; font-weight: 700; color: #a3a9b0; margin-left: 0.4rem; letter-spacing: 0; }
.lamp { display: flex; align-items: center; gap: 0.6rem; font-size: 1.15rem; font-weight: 900; text-transform: uppercase; letter-spacing: 0.04em; }
.lamp::before { content: ""; width: 1.1rem; height: 1.1rem; border-radius: 50%; background: var(--exit); transition: background-color 120ms; }
.lamp[data-busy="true"]::before { background: var(--signal); }

.counters { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.4rem; border-top: 2px solid #3a3c42; padding-top: 0.9rem; }
.counter dt { font-size: 1rem; color: #a3a9b0; }
.counter dd { margin: 0.15rem 0 0; font-size: 2.9rem; font-weight: 900; line-height: 1; }
.counter.queue dd { color: var(--signal); }

.metrics { width: 100%; border-collapse: collapse; align-self: start; }
.metrics th { font-size: 0.95rem; font-weight: 700; color: #a3a9b0; text-align: right; padding: 0 0 0.45rem; border-bottom: 2px solid #3a3c42; }
.metrics th:first-child { text-align: left; }
.metrics th.now { color: var(--signal); }
.metrics td { padding: 0.3rem 0; border-bottom: 1px solid #2c2e33; text-align: right; }
.metric-name { text-align: left !important; }
.metric-name b { display: inline-block; min-width: 3.4rem; font-family: "Cambria Math", "STIX Two Math", "Noto Serif", Georgia, serif; font-style: italic; font-size: 1.7rem; color: var(--signal); }
.metric-name span { font-size: 1.05rem; color: #d8dce0; }
.flap {
  display: inline-block; min-width: 5.6rem;
  padding: 0.18rem 0.5rem 0.05rem;
  background: #24262b; border-radius: 3px;
  font-size: 1.5rem; font-weight: 700; line-height: 1.2; text-align: right;
}
.flap.now { color: var(--signal); background: #2e2b1c; }
.flip { display: inline-block; animation: flip 260ms var(--ease-out); }
@keyframes flip { from { transform: perspective(300px) rotateX(-80deg); opacity: 0.3; } to { transform: none; opacity: 1; } }

.log { margin: 0; padding: 0.8rem 0 0; overflow: hidden; min-height: 0; list-style: none; border-top: 2px solid #3a3c42; font-size: 1.05rem; color: #c5cad0; }
.log li { display: grid; grid-template-columns: 5.2rem 1fr; padding: 0.12rem 0; }
.log li:first-child { color: #fff; }
.log time { color: #878d95; }

/* ---------- gráficas ---------- */
.charts { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1.2rem; min-height: 0; }
.chart { display: grid; grid-template-rows: auto 1fr; min-height: 0; background: var(--paper); border-radius: var(--radius); overflow: hidden; }
.chart h2 {
  display: flex; justify-content: space-between; align-items: baseline; gap: 1rem;
  margin: 0; padding: 0.6rem 0.95rem 0.45rem;
  background: var(--ink); color: #fff;
  font-size: 1.2rem; font-weight: 700;
}
.chart h2 small { font-size: 0.95rem; font-weight: 400; color: #c5cad0; }
.chart canvas { display: block; width: 100%; height: 100%; min-height: 0; }

@media (max-width: 1100px) {
  .strip { grid-template-columns: 1fr; gap: 0.9rem; }
  .gates { justify-content: flex-start; flex-wrap: wrap; }
  main { grid-template-columns: 1fr; grid-template-rows: auto; }
  .scene { aspect-ratio: 1.9; }
  .charts { grid-template-columns: 1fr; }
  .chart { height: 16rem; }
  :root { font-size: 13px; }
}
/* Pantallas bajas (1366 × 768, proyectores XGA): tablero compacto para que nada se corte */
@media (max-height: 820px) {
  .board { gap: 0.7rem; padding: 1rem 1.2rem; }
  .clock-value { font-size: 2.7rem; }
  .counters { padding-top: 0.6rem; }
  .counter dd { font-size: 2.3rem; }
  .metrics td { padding: 0.16rem 0; }
  .flap { font-size: 1.3rem; }
  .metric-name b { font-size: 1.45rem; }
  .log { display: none; }
}
@media (max-width: 1500px) {
  .brand p { display: none; }
  .gate { min-width: 0; }
  .gate-title { white-space: nowrap; }
}
@media (prefers-reduced-motion: reduce) {
  .flip { animation: none; }
  * { transition: none !important; }
}
</style>
</head>
<body>
<header class="strip">
  <div class="brand">
    <div class="brand-mark" aria-hidden="true">
      <svg viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 7h5l4.5 19h17L35 13H11.3"/><circle cx="15" cy="33" r="2.6" fill="currentColor" stroke="none"/><circle cx="29" cy="33" r="2.6" fill="currentColor" stroke="none"/>
      </svg>
    </div>
    <div>
      <h1>Caja rápida</h1>
      <p>Sistema de colas M/M/1 simulado con SimPy</p>
    </div>
  </div>
  <nav class="gates" id="gates" aria-label="Escenarios"></nav>
  <div class="controls">
    <button class="icon-button" id="play" type="button" aria-label="Pausar" aria-keyshortcuts="Space" title="Pausar / reanudar (Espacio)"></button>
    <button class="icon-button" id="restart" type="button" aria-label="Reiniciar" aria-keyshortcuts="R" title="Reiniciar (R)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 1 0 2.4-5.7"/><path d="M4 4v4.6h4.6"/></svg>
    </button>
    <div class="speed" role="group" aria-label="Velocidad en minutos simulados por segundo" id="speed">
      <span class="speed-label">min<br>por seg</span>
    </div>
  </div>
</header>

<main>
  <section class="scene" aria-label="Animación de la caja rápida">
    <svg id="scene" viewBox="0 0 1900 1000" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="scene-summary">
      <defs>
        <g id="pic-stand" stroke="currentColor" stroke-width="13" stroke-linecap="round" fill="none">
          <circle cx="0" cy="-124" r="16" fill="currentColor" stroke="none"/>
          <path d="M0 -98 V-56" stroke-width="30"/>
          <path d="M-12 -95 L-20 -56 M12 -95 L20 -56" stroke-width="10"/>
          <path d="M-7 -50 L-8 -5 M7 -50 L8 -5"/>
        </g>
        <g id="pic-walk-a" stroke="currentColor" stroke-width="13" stroke-linecap="round" fill="none">
          <circle cx="2" cy="-124" r="16" fill="currentColor" stroke="none"/>
          <path d="M1 -98 V-56" stroke-width="30"/>
          <path d="M-10 -94 L-24 -62 M12 -94 L24 -60" stroke-width="10"/>
          <path d="M-4 -50 L-21 -6 M5 -50 L19 -7"/>
        </g>
        <g id="pic-walk-b" stroke="currentColor" stroke-width="13" stroke-linecap="round" fill="none">
          <circle cx="2" cy="-124" r="16" fill="currentColor" stroke="none"/>
          <path d="M1 -98 V-56" stroke-width="30"/>
          <path d="M-10 -94 L-17 -56 M12 -94 L17 -56" stroke-width="10"/>
          <path d="M-3 -50 L-9 -5 M4 -50 L6 -5"/>
        </g>
      </defs>
      <g id="scene-static"></g>
      <g id="people"></g>
      <g id="scene-overlay"></g>
    </svg>
    <p class="sr-only" id="scene-summary" aria-live="polite"></p>
  </section>

  <aside class="board" aria-label="Resultados">
    <div class="clock">
      <div class="clock-value"><span id="clock">0.0</span><small id="clock-total">de 60 min</small></div>
      <div class="lamp" id="lamp" data-busy="false">Caja libre</div>
    </div>
    <dl class="counters">
      <div class="counter queue"><dt>En cola</dt><dd id="c-queue">0</dd></div>
      <div class="counter"><dt>En el sistema</dt><dd id="c-system">0</dd></div>
      <div class="counter"><dt>Atendidos</dt><dd id="c-served">0</dd></div>
      <div class="counter"><dt>Llegaron</dt><dd id="c-arrived">0</dd></div>
    </dl>
    <table class="metrics">
      <thead><tr><th scope="col">Métrica</th><th scope="col">Teórico</th><th scope="col" class="now">Simulado ahora</th><th scope="col" id="long-run-head">Corrida larga</th></tr></thead>
      <tbody id="metrics"></tbody>
    </table>
    <ol class="log" id="log" aria-label="Últimos eventos"></ol>
  </aside>

  <section class="charts" aria-label="Gráficas en vivo">
    <figure class="chart" style="margin:0">
      <h2>Clientes en el sistema y en la cola <small id="legend-occupancy"></small></h2>
      <canvas id="chart-occupancy" role="img" aria-label="Clientes en el sistema L(t) y en la cola Lq(t) a lo largo del tiempo, con sus valores teóricos"></canvas>
    </figure>
    <figure class="chart" style="margin:0">
      <h2>Tiempo entre llegadas <small id="legend-arrivals"></small></h2>
      <canvas id="chart-arrivals" role="img" aria-label="Histograma de tiempos entre llegadas frente a la densidad exponencial teórica"></canvas>
    </figure>
    <figure class="chart" style="margin:0">
      <h2>Tiempo de servicio <small id="legend-service"></small></h2>
      <canvas id="chart-service" role="img" aria-label="Histograma de tiempos de servicio frente a la densidad exponencial teórica"></canvas>
    </figure>
  </section>
</main>

<script>
/*__CORE__*/
</script>
<script>
const DATA = /*__DATA__*/;

// ---------- plano del local (unidades del viewBox 1900 × 1000) ----------
const ROWS_Y = [850, 670, 490, 310];
const QUEUE_RIGHT = 1190;
const QUEUE_LEFT = 230;
const PER_ROW = 10;
const SERVICE = { x: 1520, y: 850 };
const EXIT = { x: 1860, y: 850 };
const EXIT_WINDOW = 0.8; // minutos que se ve a un cliente caminar hacia la salida
const COLORS = { ink: "#16171a", signal: "#ffc20e", exit: "#00875a", alert: "#c8102e", rule: "#c2c8cf", muted: "#5d636b" };
const METRICS = [
  ["utilization", "ρ", "Utilización de la caja"],
  ["mean_in_system", "L", "Clientes en el sistema"],
  ["mean_in_queue", "Lq", "Clientes en la cola"],
  ["mean_time_in_system", "W", "Minutos en el sistema"],
  ["mean_wait", "Wq", "Minutos de espera en cola"],
];
const SPEEDS = [0.5, 1, 2, 4];
const SVG_NS = "http://www.w3.org/2000/svg";
const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

const $ = (id) => document.getElementById(id);
const fmt = (value, digits = 3) => (value === null || Number.isNaN(value) ? "—" : value.toFixed(digits));
const fmtMinute = (value) => value.toFixed(1);

function svg(tag, attrs = {}, parent) {
  const element = document.createElementNS(SVG_NS, tag);
  for (const [key, value] of Object.entries(attrs)) element.setAttribute(key, value);
  if (parent) parent.appendChild(element);
  return element;
}

function queueSpot(position) {
  const index = Math.min(position, PER_ROW * ROWS_Y.length - 1);
  const row = Math.floor(index / PER_ROW);
  const column = index % PER_ROW;
  const step = (QUEUE_RIGHT - QUEUE_LEFT) / (PER_ROW - 1);
  // Las filas pares avanzan hacia la caja (derecha) y las impares regresan: fila serpentina.
  const x = row % 2 === 0 ? QUEUE_RIGHT - column * step : QUEUE_LEFT + column * step;
  return { x, y: ROWS_Y[row] };
}

// ---------- escenario estático: letreros, cintas, caja ----------
function drawStore() {
  const root = $("scene-static");
  svg("rect", { x: 0, y: 0, width: 1900, height: 1000, fill: "#f7f8f9" }, root);
  svg("rect", { x: 0, y: 900, width: 1900, height: 100, fill: "#d3d8dd" }, root);

  // Cintas separadoras: postes negros y cinta; el paso libre alterna de lado en cada fila.
  const left = QUEUE_LEFT - 70;
  const right = QUEUE_RIGHT + 70;
  const belts = [[890, left, right], [690, left + 120, right], [510, left, right - 120], [330, left + 120, right]];
  for (const [y, x1, x2] of belts) {
    svg("line", { x1, y1: y, x2, y2: y, stroke: COLORS.ink, "stroke-width": 5, "stroke-opacity": 0.75 }, root);
    for (const x of [x1, (x1 + x2) / 2, x2]) {
      svg("line", { x1: x, y1: y - 12, x2: x, y2: y + 12, stroke: COLORS.ink, "stroke-width": 9, "stroke-linecap": "round" }, root);
    }
  }
  // Marca de piso: espere su turno
  text(root, QUEUE_RIGHT + 40, 962, "ESPERE SU TURNO", { size: 28, weight: 900, fill: COLORS.ink, spacing: 2, anchor: "end" });
  svg("rect", { x: QUEUE_RIGHT + 70, y: 902, width: 12, height: 80, fill: COLORS.signal }, root);
  // Punto de atención
  svg("rect", { x: SERVICE.x - 70, y: 902, width: 140, height: 16, rx: 3, fill: COLORS.signal }, root);
  text(root, SERVICE.x, 962, "PASE", { size: 28, weight: 900, fill: COLORS.ink, spacing: 2, anchor: "middle" });

  // Letrero colgante de la caja
  for (const x of [1395, 1815]) svg("line", { x1: x, y1: 0, x2: x, y2: 60, stroke: COLORS.ink, "stroke-width": 4 }, root);
  svg("rect", { x: 1330, y: 60, width: 550, height: 150, rx: 8, fill: COLORS.ink }, root);
  svg("rect", { x: 1352, y: 82, width: 106, height: 106, rx: 6, fill: COLORS.signal }, root);
  const cart = svg("g", { transform: "translate(1365 95) scale(2)", fill: "none", stroke: COLORS.ink, "stroke-width": 3.4, "stroke-linecap": "round", "stroke-linejoin": "round" }, root);
  svg("path", { d: "M4 7h5l4.5 19h17L35 13H11.3" }, cart);
  svg("circle", { cx: 15, cy: 33, r: 2.6, fill: COLORS.ink, stroke: "none" }, cart);
  svg("circle", { cx: 29, cy: 33, r: 2.6, fill: COLORS.ink, stroke: "none" }, cart);
  text(root, 1482, 140, "Caja rápida", { size: 52, weight: 900, fill: "#fff" });
  text(root, 1484, 184, "Hasta 10 artículos", { size: 30, weight: 400, fill: "#c5cad0" });

  // Mostrador al fondo con la cajera detrás; el cliente atendido se para delante.
  svg("use", { href: "#pic-stand", x: 1560, y: 770, color: COLORS.ink }, root);
  svg("rect", { x: 1400, y: 690, width: 280, height: 110, rx: 6, fill: "#cdd3d9", stroke: COLORS.ink, "stroke-width": 6 }, root);
  svg("rect", { x: 1403, y: 693, width: 274, height: 14, fill: COLORS.signal }, root);
  svg("rect", { x: 1610, y: 628, width: 58, height: 44, rx: 4, fill: COLORS.ink }, root);
  svg("rect", { x: 1631, y: 672, width: 16, height: 18, fill: COLORS.ink }, root);
  // Lámpara de carril sobre un poste: verde libre, amarilla atendiendo
  svg("line", { x1: 1420, y1: 690, x2: 1420, y2: 520, stroke: COLORS.ink, "stroke-width": 8 }, root);

  // Entrada y salida
  sign(root, 22, 30, 250, 74, COLORS.ink, "Entrada", "right");
  sign(root, 1660, 420, 220, 70, COLORS.exit, "Salida", "right");
}

function text(parent, x, y, content, { size, weight = 400, fill, anchor = "start", spacing = 0 }) {
  const element = svg("text", { x, y, "font-size": size, "font-weight": weight, fill, "text-anchor": anchor, "letter-spacing": spacing }, parent);
  element.textContent = content;
  return element;
}

function sign(parent, x, y, width, height, color, label, direction) {
  svg("rect", { x, y, width, height, rx: 6, fill: color }, parent);
  text(parent, x + 22, y + height * 0.68, label, { size: height * 0.5, weight: 900, fill: "#fff" });
  const ax = x + width - 58;
  const ay = y + height / 2;
  const arrow = direction === "right" ? `M${ax} ${ay} h36 M${ax + 22} ${ay - 15} l15 15 l-15 15` : "";
  svg("path", { d: arrow, stroke: "#fff", "stroke-width": 8, fill: "none", "stroke-linecap": "round", "stroke-linejoin": "round" }, parent);
}

// ---------- elementos dinámicos del local ----------
const overlay = {};
function drawOverlay() {
  const root = $("scene-overlay");
  overlay.lamp = svg("circle", { cx: 1420, cy: 500, r: 30, fill: COLORS.exit, stroke: COLORS.ink, "stroke-width": 7 }, root);
  svg("rect", { x: 1330, y: 232, width: 550, height: 22, rx: 4, fill: "#fff", stroke: COLORS.ink, "stroke-width": 4 }, root);
  overlay.progress = svg("rect", { x: 1332, y: 234, width: 0, height: 18, fill: COLORS.signal }, root);
  overlay.progressLabel = text(root, 1330, 296, "", { size: 30, weight: 700, fill: COLORS.ink });
  overlay.params = text(root, 300, 76, "", { size: 30, weight: 700, fill: COLORS.ink });
  overlay.overflow = svg("g", { visibility: "hidden" }, root);
  svg("rect", { x: 300, y: 112, width: 520, height: 64, rx: 6, fill: COLORS.ink }, overlay.overflow);
  overlay.overflowText = text(overlay.overflow, 322, 156, "", { size: 34, weight: 900, fill: COLORS.signal });
  overlay.alert = svg("g", { visibility: "hidden" }, root);
  svg("rect", { x: 840, y: 112, width: 450, height: 64, rx: 6, fill: COLORS.alert }, overlay.alert);
  overlay.alertText = text(overlay.alert, 862, 156, "", { size: 34, weight: 900, fill: "#fff" });
}

// ---------- estado de la reproducción ----------
const app = {
  index: Math.max(0, DATA.scenarios.findIndex((s) => s.number === DATA.startScenario)),
  time: 0,
  playing: true,
  speed: DATA.minutesPerSecond,
  people: new Map(),
  lastFrame: performance.now(),
  lastBoard: 0,
};

function scenario() { return DATA.scenarios[app.index]; }

function load(index) {
  app.index = index;
  app.time = 0;
  app.playing = true;
  app.lastBoard = 0;
  for (const person of app.people.values()) person.el.remove();
  app.people.clear();
  const current = scenario();
  current.trace = current.trace || Core.occupancyTrace(current.customers, DATA.duration);
  current.byId = current.byId || new Map(current.customers.map((record) => [record[0], record]));
  current.events = current.events || buildEvents(current.customers);
  for (const button of $("gates").children) button.setAttribute("aria-pressed", String(Number(button.dataset.index) === index));
  overlay.params.textContent = "";
  [`λ = ${current.lambda.toFixed(1)} llegadas/min`, `μ = ${current.mu.toFixed(1)} atenciones/min`, `ρ = λ/μ = ${fmt(current.theory.utilization)}`]
    .forEach((part, i) => { const span = svg("tspan", { dx: i ? 30 : 0 }, overlay.params); span.textContent = part; });
  $("long-run-head").textContent = `${String(Math.round(current.longRunMinutes)).replace(/\B(?=(\d{3})+(?!\d))/g, "\u2009")} min`;
  $("clock-total").textContent = `de ${DATA.duration} min`;
  buildMetricRows(current);
  $("scene-summary").textContent = `${current.label}. λ = ${current.lambda}, μ = ${current.mu} clientes por minuto.`;
  updatePlayButton();
  render(true);
}

function buildEvents(customers) {
  const events = [];
  for (const [id, arrival, start, departure] of customers) {
    events.push([arrival, `Llega el cliente ${id}`]);
    if (start !== null && start <= DATA.duration) events.push([start, `Cliente ${id} pasa a la caja, esperó ${fmt(start - arrival, 2)} min`]);
    if (departure !== null && departure <= DATA.duration) events.push([departure, `Cliente ${id} paga y sale`]);
  }
  return events.sort((a, b) => a[0] - b[0]);
}

function buildMetricRows(current) {
  const body = $("metrics");
  body.textContent = "";
  for (const [key, symbol, name] of METRICS) {
    const row = document.createElement("tr");
    row.innerHTML = `<td class="metric-name"><b>${symbol}</b><span>${name}</span></td>` +
      `<td><span class="flap">${fmt(current.theory[key])}</span></td>` +
      `<td><span class="flap now" data-key="${key}">—</span></td>` +
      `<td><span class="flap">${fmt(current.longRun[key])}</span></td>`;
    body.appendChild(row);
  }
}

// ---------- personas ----------
function personTarget(id, state) {
  if (state.leaving.includes(id)) {
    const record = scenario().byId.get(id);
    const progress = Math.min((app.time - record[3]) / EXIT_WINDOW, 1);
    return { x: SERVICE.x + (EXIT.x - SERVICE.x) * progress, y: SERVICE.y, fixed: true };
  }
  if (id === state.inService) return SERVICE;
  return queueSpot(state.waiting.indexOf(id));
}

function updatePeople(state, dtSeconds) {
  const visible = new Set([...state.waiting, ...state.leaving]);
  if (state.inService !== null) visible.add(state.inService);
  for (const [id, person] of app.people) {
    if (!visible.has(id)) { person.el.remove(); app.people.delete(id); }
  }
  const ease = reducedMotion ? 1 : 1 - Math.exp(-dtSeconds * 7 * Math.max(1, app.speed));
  const stride = Math.floor(performance.now() / 170) % 2;
  for (const id of visible) {
    const target = personTarget(id, state);
    let person = app.people.get(id);
    if (!person) {
      const el = svg("g", { class: "person" }, $("people"));
      const body = svg("use", { href: "#pic-stand" }, el);
      const label = text(el, 1, -68, String(id), { size: 19, weight: 900, fill: "#fff", anchor: "middle" });
      person = { el, body, label, x: -90, y: target.y, pose: "" };
      app.people.set(id, person);
    }
    if (target.fixed) { person.x = target.x; person.y = target.y; }
    else { person.x += (target.x - person.x) * ease; person.y += (target.y - person.y) * ease; }
    const moving = Math.hypot(target.x - person.x, target.y - person.y) > 3 || target.fixed;
    const pose = moving && !reducedMotion ? (stride ? "#pic-walk-a" : "#pic-walk-b") : "#pic-stand";
    if (pose !== person.pose) { person.body.setAttribute("href", pose); person.pose = pose; }
    const color = state.leaving.includes(id) ? COLORS.exit : COLORS.ink;
    person.el.setAttribute("color", color);
    person.label.setAttribute("visibility", state.leaving.includes(id) ? "hidden" : "visible");
    person.el.setAttribute("transform", `translate(${person.x.toFixed(1)} ${person.y.toFixed(1)})`);
    const exitProgress = target.fixed ? (person.x - SERVICE.x) / (EXIT.x - SERVICE.x) : 0;
    person.el.setAttribute("opacity", Math.max(0, Math.min(1, (1 - exitProgress) / 0.35)).toFixed(2));
  }
}

// ---------- tablero ----------
// Cambio de valor con giro de paleta, como un tablero de salidas.
function flip(element) {
  element.classList.remove("flip");
  void element.offsetWidth;
  element.classList.add("flip");
}
function setFlap(element, value) {
  if (element.textContent === value) return;
  element.textContent = value;
  flip(element);
}

function updateBoard(state) {
  const current = scenario();
  const clock = $("clock");
  if (Math.floor(app.time) !== Math.floor(Number(clock.textContent))) flip(clock);
  clock.textContent = fmtMinute(app.time);
  const inSystem = state.waiting.length + (state.inService === null ? 0 : 1);
  setFlap($("c-queue"), String(state.waiting.length));
  setFlap($("c-system"), String(inSystem));
  setFlap($("c-served"), String(state.served));
  setFlap($("c-arrived"), String(state.arrived));
  const busy = state.inService !== null;
  $("lamp").dataset.busy = String(busy);
  $("lamp").textContent = busy ? "Atendiendo" : "Caja libre";
  const live = Core.metricsAt(current.customers, app.time);
  for (const cell of document.querySelectorAll(".flap.now")) {
    setFlap(cell, live ? fmt(live[cell.dataset.key]) : "—");
  }
  const recent = current.events.filter(([time]) => time <= app.time).slice(-4).reverse();
  const log = $("log");
  log.innerHTML = recent.map(([time, label]) => `<li><time>min ${fmtMinute(time)}</time><span>${label}</span></li>`).join("");
  while (log.children.length > 1 && log.scrollHeight > log.clientHeight) log.lastElementChild.remove();
}

function updateOverlay(state) {
  const current = scenario();
  const busy = state.inService !== null;
  overlay.lamp.setAttribute("fill", busy ? COLORS.signal : COLORS.exit);
  if (busy) {
    const [, , start, departure] = current.byId.get(state.inService);
    const end = departure === null ? DATA.duration : departure;
    const fraction = end > start ? Math.min((app.time - start) / (end - start), 1) : 1;
    overlay.progress.setAttribute("width", (546 * fraction).toFixed(1));
    overlay.progressLabel.textContent = `Cobrando al cliente ${state.inService}`;
  } else {
    overlay.progress.setAttribute("width", 0);
    overlay.progressLabel.textContent = "Esperando cliente";
  }
  const hidden = state.waiting.length - PER_ROW * ROWS_Y.length;
  overlay.overflow.setAttribute("visibility", hidden > 0 ? "visible" : "hidden");
  overlay.overflowText.textContent = `+${hidden} esperando fuera de la fila`;
  const crowded = state.waiting.length >= 12 && current.theory.utilization >= 0.9;
  overlay.alert.setAttribute("visibility", crowded ? "visible" : "hidden");
  overlay.alertText.textContent = `ρ = ${fmt(current.theory.utilization)}: la cola crece`;
}

// ---------- gráficas ----------
function prepareCanvas(canvas) {
  const ratio = window.devicePixelRatio || 1;
  const { width, height } = canvas.getBoundingClientRect();
  if (canvas.width !== Math.round(width * ratio) || canvas.height !== Math.round(height * ratio)) {
    canvas.width = Math.round(width * ratio);
    canvas.height = Math.round(height * ratio);
  }
  const ctx = canvas.getContext("2d");
  ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
  ctx.clearRect(0, 0, width, height);
  return { ctx, width, height };
}

function rootPx() { return parseFloat(getComputedStyle(document.documentElement).fontSize); }

function drawAxes(ctx, box, xMax, yMax, xLabel, xTicks, yTicks) {
  const font = rootPx();
  ctx.font = `400 ${font * 0.95}px Overpass, sans-serif`;
  ctx.fillStyle = COLORS.muted;
  ctx.strokeStyle = "#e1e5e9";
  ctx.lineWidth = 1;
  ctx.textAlign = "right";
  ctx.textBaseline = "middle";
  for (const tick of yTicks) {
    const y = box.y + box.h - (tick / yMax) * box.h;
    ctx.beginPath(); ctx.moveTo(box.x, y); ctx.lineTo(box.x + box.w, y); ctx.stroke();
    ctx.fillText(Number.isInteger(tick) ? tick : tick.toFixed(1), box.x - 8, y);
  }
  ctx.textAlign = "center";
  ctx.textBaseline = "top";
  for (const tick of xTicks) ctx.fillText(Number.isInteger(tick) ? tick : tick.toFixed(1), box.x + (tick / xMax) * box.w, box.y + box.h + 7);
  ctx.textAlign = "right";
  ctx.fillText(xLabel, box.x + box.w, box.y + box.h + font * 1.6);
  ctx.strokeStyle = COLORS.ink;
  ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.moveTo(box.x, box.y + box.h); ctx.lineTo(box.x + box.w, box.y + box.h); ctx.stroke();
}

function niceTicks(max, count) {
  const raw = max / count;
  const magnitude = 10 ** Math.floor(Math.log10(raw));
  const step = [1, 2, 2.5, 5, 10].map((m) => m * magnitude).find((s) => s >= raw);
  const ticks = [];
  for (let value = 0; value <= max + 1e-9; value += step) ticks.push(Math.round(value * 1000) / 1000);
  return ticks;
}

function chartBox(width, height) {
  const font = rootPx();
  return { x: font * 2.8, y: font * 0.9, w: width - font * 3.8, h: height - font * 3.6 };
}

function drawOccupancy() {
  const { ctx, width, height } = prepareCanvas($("chart-occupancy"));
  const current = scenario();
  const { times, inSystem, inQueue } = current.trace;
  const yMax = Math.max(Math.max(...inSystem), current.theory.mean_in_system) * 1.25 + 1;
  const box = chartBox(width, height);
  drawAxes(ctx, box, DATA.duration, yMax, "Tiempo (min)", niceTicks(DATA.duration, 6), niceTicks(yMax, 4));
  const px = (t) => box.x + (t / DATA.duration) * box.w;
  const py = (v) => box.y + box.h - (v / yMax) * box.h;
  const theoryLine = (value, color) => {
    ctx.setLineDash([10, 7]); ctx.strokeStyle = color; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.moveTo(box.x, py(value)); ctx.lineTo(box.x + box.w, py(value)); ctx.stroke(); ctx.setLineDash([]);
  };
  theoryLine(current.theory.mean_in_system, COLORS.ink);
  theoryLine(current.theory.mean_in_queue, COLORS.exit);
  const step = (values, color, lineWidth) => {
    ctx.strokeStyle = color; ctx.lineWidth = lineWidth; ctx.lineJoin = "miter";
    ctx.beginPath(); ctx.moveTo(px(0), py(values[0]));
    for (let i = 1; i < times.length && times[i] <= app.time; i += 1) {
      ctx.lineTo(px(times[i]), py(values[i - 1])); ctx.lineTo(px(times[i]), py(values[i]));
    }
    const last = times.findLastIndex((t) => t <= app.time);
    ctx.lineTo(px(app.time), py(values[last])); ctx.stroke();
  };
  step(inQueue, COLORS.exit, 3);
  step(inSystem, COLORS.ink, 3);
  ctx.strokeStyle = COLORS.signal; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.moveTo(px(app.time), box.y); ctx.lineTo(px(app.time), box.y + box.h); ctx.stroke();
  $("legend-occupancy").textContent = `teórico L ${fmt(current.theory.mean_in_system, 2)}\u2003Lq ${fmt(current.theory.mean_in_queue, 2)}`;
  drawKey(ctx, box, [["L(t) simulado", COLORS.ink, false], ["Lq(t) simulado", COLORS.exit, false], ["teórico", COLORS.muted, true]]);
}

// Leyenda dibujada en el lienzo; en los histogramas va a la derecha para no tapar las barras altas.
function drawKey(ctx, box, entries, alignRight = false) {
  const font = rootPx();
  ctx.font = `700 ${font * 0.95}px Overpass, sans-serif`;
  ctx.textAlign = "left";
  ctx.textBaseline = "middle";
  const total = entries.reduce((sum, [label]) => sum + font * 2.6 + ctx.measureText(label).width, 0);
  let x = alignRight ? box.x + box.w - total : box.x + 10;
  const y = box.y + font * 0.6;
  for (const [label, color, dashed] of entries) {
    ctx.strokeStyle = color; ctx.lineWidth = 3; ctx.setLineDash(dashed ? [7, 5] : []);
    ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + font * 1.6, y); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle = COLORS.ink;
    ctx.fillText(label, x + font * 2, y);
    x += font * 2.6 + ctx.measureText(label).width;
  }
}

function drawHistogram(canvasId, legendId, values, rate, symbol) {
  const { ctx, width, height } = prepareCanvas($(canvasId));
  const bins = 14;
  const xMax = 4 / rate;
  const densities = Core.histogramDensity(values, xMax, bins);
  const yMax = rate * 1.6;
  const box = chartBox(width, height);
  drawAxes(ctx, box, xMax, yMax, "minutos", niceTicks(xMax, 5), niceTicks(yMax, 3));
  const barWidth = box.w / bins;
  ctx.fillStyle = "#bfc6ce";
  densities.forEach((density, index) => {
    const h = (Math.min(density, yMax) / yMax) * box.h;
    ctx.fillRect(box.x + index * barWidth + 1.5, box.y + box.h - h, barWidth - 3, h);
  });
  ctx.strokeStyle = COLORS.ink; ctx.lineWidth = 3.5;
  ctx.beginPath();
  for (let i = 0; i <= 80; i += 1) {
    const x = (xMax * i) / 80;
    const y = rate * Math.exp(-rate * x);
    const cx = box.x + (x / xMax) * box.w;
    const cy = box.y + box.h - (Math.min(y, yMax) / yMax) * box.h;
    if (i === 0) ctx.moveTo(cx, cy); else ctx.lineTo(cx, cy);
  }
  ctx.stroke();
  drawKey(ctx, box, [["simulado", "#bfc6ce", false], ["exponencial teórica", COLORS.ink, false]], true);
  const mean = values.length ? values.reduce((a, b) => a + b, 0) / values.length : NaN;
  $(legendId).textContent = `media ${fmt(mean, 2)}\u2003teórica ${fmt(1 / rate, 2)} min`;
}

function drawCharts() {
  const current = scenario();
  drawOccupancy();
  drawHistogram("chart-arrivals", "legend-arrivals", Core.interarrivalTimes(current.customers, app.time), current.lambda, "λ");
  drawHistogram("chart-service", "legend-service", Core.serviceTimes(current.customers, app.time), current.mu, "μ");
}

// ---------- bucle ----------
function render(forceBoard = false, dtSeconds = 0) {
  const state = Core.stateAt(scenario().customers, app.time, EXIT_WINDOW);
  updatePeople(state, dtSeconds);
  updateOverlay(state);
  const now = performance.now();
  if (forceBoard || now - app.lastBoard > 350) {
    updateBoard(state);
    app.lastBoard = now;
  }
  drawCharts();
}

function frame(now) {
  const dtSeconds = Math.min((now - app.lastFrame) / 1000, 0.1);
  app.lastFrame = now;
  if (app.playing) {
    app.time = Math.min(app.time + dtSeconds * app.speed, DATA.duration);
    if (app.time >= DATA.duration) { app.playing = false; updatePlayButton(); render(true, dtSeconds); }
  }
  render(false, dtSeconds);
  requestAnimationFrame(frame);
}

// ---------- controles ----------
const ICONS = {
  pause: '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="5" y="4" width="5" height="16" rx="1.2"/><rect x="14" y="4" width="5" height="16" rx="1.2"/></svg>',
  play: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15a1 1 0 0 0 1.5.86l12-7.5a1 1 0 0 0 0-1.72l-12-7.5A1 1 0 0 0 7 4.5z"/></svg>',
};
function updatePlayButton() {
  const button = $("play");
  button.innerHTML = app.playing ? ICONS.pause : ICONS.play;
  button.setAttribute("aria-label", app.playing ? "Pausar" : "Reproducir");
}
function togglePlay() {
  if (!app.playing && app.time >= DATA.duration) app.time = 0;
  app.playing = !app.playing;
  updatePlayButton();
}
function setSpeed(speed) {
  app.speed = speed;
  for (const button of $("speed").querySelectorAll("button")) button.setAttribute("aria-pressed", String(Number(button.dataset.speed) === speed));
}

function buildControls() {
  DATA.scenarios.forEach((current, index) => {
    const button = document.createElement("button");
    button.type = "button";
    button.className = "gate";
    button.dataset.index = index;
    button.setAttribute("aria-keyshortcuts", String(index + 1));
    button.innerHTML = `<span class="gate-number">${current.number || "λ"}</span><span class="gate-title">${current.condition}</span>` +
      `<span class="gate-params"><span>λ ${current.lambda.toFixed(1)}</span><span>μ ${current.mu.toFixed(1)}</span><span>ρ ${fmt(current.theory.utilization)}</span></span>`;
    button.addEventListener("click", () => load(index));
    $("gates").appendChild(button);
  });
  for (const speed of SPEEDS) {
    const button = document.createElement("button");
    button.type = "button";
    button.dataset.speed = speed;
    button.textContent = String(speed);
    button.addEventListener("click", () => setSpeed(speed));
    $("speed").appendChild(button);
  }
  $("play").addEventListener("click", togglePlay);
  $("restart").addEventListener("click", () => load(app.index));
  document.addEventListener("keydown", (event) => {
    if (event.target.closest("button") && (event.key === " " || event.key === "Enter")) return;
    if (event.key === " ") { event.preventDefault(); togglePlay(); }
    else if (event.key === "r" || event.key === "R") load(app.index);
    else if (/^[1-9]$/.test(event.key) && Number(event.key) <= DATA.scenarios.length) load(Number(event.key) - 1);
    else if (event.key === "ArrowRight") setSpeed(SPEEDS[Math.min(SPEEDS.indexOf(app.speed) + 1, SPEEDS.length - 1)]);
    else if (event.key === "ArrowLeft") setSpeed(SPEEDS[Math.max(SPEEDS.indexOf(app.speed) - 1, 0)]);
  });
}

// Modo captura (?t=24&escenario=2): congela la pantalla en un minuto para el informe.
function applyCaptureParams() {
  const params = new URLSearchParams(location.search);
  if (params.has("escenario")) {
    const index = DATA.scenarios.findIndex((s) => String(s.number) === params.get("escenario"));
    if (index >= 0) load(index);
  }
  if (params.has("t")) {
    const target = Math.min(Number(params.get("t")), DATA.duration);
    app.playing = false;
    updatePlayButton();
    // Avanza en pasos cortos para que cada persona llegue a su lugar en la fila.
    for (let t = 0; t <= target; t = Math.min(t + 0.05, target)) {
      app.time = t;
      render(false, 0.2);
      if (t === target) break;
    }
    for (let i = 0; i < 40; i += 1) render(false, 0.2);
    render(true, 0.2);
  }
}

document.fonts.ready.then(() => {
  drawStore();
  drawOverlay();
  if (!SPEEDS.includes(app.speed)) { SPEEDS.push(app.speed); SPEEDS.sort((a, b) => a - b); }
  buildControls();
  setSpeed(app.speed);
  load(app.index);
  applyCaptureParams();
  window.addEventListener("resize", () => render(true));
  requestAnimationFrame((now) => { app.lastFrame = now; requestAnimationFrame(frame); });
});
</script>
